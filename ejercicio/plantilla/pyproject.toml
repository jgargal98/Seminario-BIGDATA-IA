[project]
name = "analisis-bigdata-ia"
version = "1.0.0"
description = "Seminario: Big Data con IA. Cómo guiar a un asistente para analizar grandes volúmenes de datos."
readme = "README.md"
# Upper bound keeps every student on the same Python; uv downloads it if missing.
requires-python = ">=3.12,<3.13"
dependencies = [
    # Must match the DuckDB version pinned by mcp-server-motherduck 1.1.0:
    # a database file written by a newer DuckDB cannot be opened by the MCP server.
    "duckdb==1.5.6",
    "pandas>=2.2",
    "pyarrow>=18",
    "psutil>=6",
    "huggingface-hub>=0.34",  # first version shipping the `hf` command
    "transformers>=4.46",
    "torch>=2.5",
    "matplotlib>=3.9",
    "mcp>=1.2",               # only used by scripts/test_mcp.py
]

[tool.uv]
# Plain project with dependencies, nothing to build or install as a package.
package = false

# CPU-only PyTorch on Windows and Linux: the default Linux build pulls several GB
# of GPU libraries the seminar does not need. macOS has no separate CPU build.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
